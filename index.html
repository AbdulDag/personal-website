<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abdulhamid Daghistani's Website</title>
    <meta name="description" content="Abdulhamid Daghistani — Mechatronics Engineering @ University of Guelph. ML, computer vision, and systems." />
    <style>
      :root {
        font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        font-weight: 400;
        color: #213547;
        background-color: #ffffff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      *, *::before, *::after { box-sizing: border-box; }

      body { margin: 0; min-width: 320px; }
      h1, h2, h3, p { margin: 0; }
      a { color: inherit; text-decoration: inherit; }

      #root { margin: 0 auto; width: 100%; text-align: center; }

      .page { min-height: 100vh; background: #ffffff; padding: 2rem; }
      .container { max-width: 72rem; margin: 0 auto; }

      .about { margin-top: 7.5rem; margin-bottom: 6.5rem; }
      .about h1 { font-size: 2.25rem; line-height: 2.5rem; color: #000; font-weight: 700; margin-bottom: 1rem; }
      .about-inner { max-width: 42rem; margin: 0 auto; }
      .about p { color: #374151; font-size: 1.125rem; line-height: 1.75rem; margin-bottom: 1rem; }
      .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
      .links a { color: #374151; font-weight: 500; transition: color 150ms; }
      .links a:hover { color: #000; }

      .section-title { font-size: 1.5rem; line-height: 2rem; color: #000; font-weight: 700; margin-bottom: 2rem; }

      .grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
      @media (min-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
      @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }

      .card {
        display: block;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
        overflow: hidden;
        transition: box-shadow 150ms;
      }
      .card:hover { box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); }
      .card-media { position: relative; aspect-ratio: 16 / 9; background: #f3f4f6; }
      .card-media img, .card-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card-media .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 800ms ease; }
      .card-media .slide.on { opacity: 1; }
      .card-media .placeholder {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        padding: 1rem; color: #9ca3af; font-size: 1.25rem; font-weight: 600;
      }
      .card-body { padding: 1rem; }
      .card-body h3 { color: #374151; font-size: 1rem; line-height: 1.5rem; font-weight: 400; }
      .card-body p { color: #4b5563; font-size: 0.875rem; line-height: 1.25rem; white-space: pre-line; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="page">
        <div class="container">
          <section class="about">
            <h1>Abdulhamid Daghistani</h1>
            <div class="about-inner">
              <p>I build machines that see and think</p>
              <div class="links">
                <a href="https://github.com/AbdulDag" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="https://linkedin.com/in/abdulhamid-daghistani" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <a href="mailto:adaghist@gmail.com">Email</a>
              </div>
            </div>
          </section>

          <h2 class="section-title">What I've been up to</h2>
          <div class="grid" id="projects"></div>
        </div>
      </div>
    </div>

    <script>
      // mediaUrl: a .mp4/.jpg in /media, or an array of images for a slideshow.
      const gh = (repo) => 'https://github.com/AbdulDag/' + repo;

      const projects = [
        {
          title: 'Cattle Health Classifier',
          description: 'CNN that tells healthy from sick cattle off 216 images, served through a Flask API on Google Cloud\nUniversity of Guelph research',
          mediaUrl: 'media/cattle_health.mp4',
          githubUrl: gh('Cattle-Health-Classification-Model'),
        },
        {
          title: 'Parivo Health',
          description: "Parkinson's and dementia monitoring from a 20-second weekly check-in: tremor, voice, and facial biomarkers fused into risk scores\nCaltech Longevity Hackathon",
          mediaUrl: 'media/parivo.mp4',
          githubUrl: 'https://caltech-hackathon.vercel.app/',
        },
        {
          title: 'CadX',
          description: 'C# SolidWorks add-in that automates drawing exports and file naming\nLive pilot with 50 concurrent mechanical engineering users',
          mediaUrl: 'media/cadx.mp4',
          githubUrl: 'https://www.getcadx.com/',
        },
        {
          title: 'AuditFlow',
          description: 'Runs ML papers\' code in sandboxed Docker containers, self-heals broken environments with a ReAct agent, and scores reproducibility\nGDG Hacks 3',
          mediaUrl: 'media/auditflow.mp4',
          githubUrl: 'https://devpost.com/software/auditflow',
        },
        {
          title: 'FABLOOP',
          description: 'Material exchange platform and SolidWorks add-in that uses a computer vision sorting model to design with scrap steel, cutting disposal costs 40%\n1st Place, GEC 2026 Re-Design',
          mediaUrl: 'media/fabloop.jpg',
        },
        {
          title: 'H2@Home',
          description: 'Smart residential hydrogen system for safe, decentralized fuel production\n1st Place, GEC 2025 Innovative Design · Ingenious+ Ontario winner',
          mediaUrl: 'media/h2home.jpg',
          githubUrl: 'https://ingeniousplus.ca/ontario-2026/',
        },
        {
          title: 'EntryVision',
          description: 'Face-recognition door lock: OpenCV checks faces against an approved list and an Arduino releases the electromagnetic lock\n1st Place, SproutHacks',
          mediaUrl: ['media/entryvision_1.jpg', 'media/entryvision_2.jpg'],
          githubUrl: 'https://devpost.com/software/entryvision',
        },
        {
          title: 'K.A.R.E.N',
          description: "The world's meanest FPGA-powered assistant: SystemVerilog video pipeline, Breakout in hardware, Gemini-driven voice nagging\nuOttaHack 8",
          mediaUrl: 'media/karen.mp4',
          githubUrl: 'https://devpost.com/software/karen-5g01yk',
        },
        {
          title: 'Web Serial Projection',
          description: 'Browser-based control system that syncs 3D projection mapping with physical hardware',
          mediaUrl: 'media/projection.mp4',
          githubUrl: gh('web-serial-projection'),
        },
        {
          title: 'AXI4-Lite UVM Testbench',
          description: 'SystemVerilog/UVM testbench that checks an AXI4-Lite bus slave reads and writes correctly',
          mediaUrl: 'media/axi4.jpg',
          githubUrl: gh('axi4_lite_uvm_vip'),
        },
        {
          title: 'Access Control Automation',
          description: 'Python/PowerShell automation on an access-control platform\'s undocumented REST API that registered 10,795 doors across 8 sites with zero errors\nBridge I.T',
          mediaUrl: 'media/access_control.mp4',
        },
        {
          title: '3D-Printed Mortise Repair',
          description: 'Designed and 3D-printed a custom repair for 138 fire-rated doors with over-drilled mortise holes, saving the client $90,000+ in rework\nBridge I.T',
          mediaUrl: ['media/printing_1.jpg', 'media/printing_2.jpg', 'media/printing_3.jpg', 'media/printing_4.jpg'],
        },
        {
          title: 'Livestock Gait Anomaly Detection',
          description: 'YOLOv8-Pose pipeline that tracks cow joint angles to catch lameness early\nUniversity of Guelph research',
          mediaUrl: 'media/livestock_gait.jpg',
          githubUrl: gh('livestock-anomaly-detection'),
        },
      ];

      const isVideo = (url) => /\.(webm|mp4)$/i.test(url);

      const grid = document.getElementById('projects');
      for (const p of projects) {
        const card = document.createElement('a');
        card.className = 'card';
        if (p.githubUrl) {
          card.href = p.githubUrl;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
        }

        const media = document.createElement('div');
        media.className = 'card-media';
        if (Array.isArray(p.mediaUrl)) {
          // several photos: crossfade between them
          const imgs = p.mediaUrl.map((src, i) => {
            const img = document.createElement('img');
            Object.assign(img, { src, alt: p.title, loading: 'lazy' });
            img.className = 'slide' + (i === 0 ? ' on' : '');
            media.appendChild(img);
            return img;
          });
          let cur = 0;
          setInterval(() => {
            imgs[cur].classList.remove('on');
            cur = (cur + 1) % imgs.length;
            imgs[cur].classList.add('on');
          }, 3000);
        } else if (p.mediaUrl && isVideo(p.mediaUrl)) {
          const v = document.createElement('video');
          Object.assign(v, { src: p.mediaUrl, autoplay: true, muted: true, loop: true, playsInline: true });
          media.appendChild(v);
        } else if (p.mediaUrl) {
          const img = document.createElement('img');
          Object.assign(img, { src: p.mediaUrl, alt: p.title, loading: 'lazy' });
          media.appendChild(img);
        } else {
          const ph = document.createElement('div');
          ph.className = 'placeholder';
          ph.textContent = p.title;
          media.appendChild(ph);
        }

        const body = document.createElement('div');
        body.className = 'card-body';
        const h3 = document.createElement('h3');
        h3.textContent = p.title;
        const desc = document.createElement('p');
        desc.textContent = p.description;
        body.append(h3, desc);

        card.append(media, body);
        grid.appendChild(card);
      }
    </script>
  </body>
</html>
